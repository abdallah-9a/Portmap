<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portmap</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <div class="container mx-auto p-4">
        <header class="mb-8">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-3xl font-bold">Portmap Live Monitor</h1>
                    <p class="text-slate-400">Real-time view of listening network connections on this machine.</p>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="relative flex h-3 w-3">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                    </span>
                    <span class="text-green-400">Live Streaming</span>
                </div>
            </div>
        </header>
        <table class="w-full text-left">
            <thead class="border-b border-slate-700">
                <tr>
                    <th class="p-4 w-1/6 text-sm font-medium uppercase tracking-wider">Port</th>
                    <th class="p-4 w-1/6 text-sm font-medium uppercase tracking-wider">PID</th>
                    <th class="p-4 w-3/6 text-sm font-medium uppercase tracking-wider">Process Name</th>
                    <th class="p-4 w-1/6 text-sm font-medium uppercase tracking-wider text-center">Action</th>
                </tr>
            </thead>
            <tbody id="connections-table-body">
                <!-- Mock Row 1: User Process -->
                <tr class="border-b border-slate-800">
                    <td class="p-4 font-mono text-cyan-400">8000</td>
                    <td class="p-4">12345</td>
                    <td class="p-4">
                        <div class="flex items-center">
                            <span class="px-2 py-1 text-xs font-semibold bg-blue-500 text-white rounded-full">python3</span>
                        </div>
                    </td>
                    <td class="p-4 text-center">
                        <button class="bg-red-600 hover:bg-red-700 text-white font-bold py-1 px-3 rounded text-xs">Kill</button>
                    </td>
                </tr>
                <!-- Mock Row 2: System Process -->
                <tr class="border-b border-slate-800">
                    <td class="p-4 font-mono text-slate-500">53</td>
                    <td class="p-4 text-slate-500">N/A</td>
                    <td class="p-4">
                        <div class="flex items-center">
                            <span class="px-2 py-1 text-xs font-semibold bg-slate-700 text-slate-300 rounded-full">Protected</span>
                        </div>
                    </td>
                    <td class="p-4 text-center">
                        <span class="text-xs text-slate-500 italic">System Protected</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws/scan`);

        ws.onmessage = function(event) {
            const connections = JSON.parse(event.data);
            const tableBody = document.getElementById('connections-table-body');
            let tableContent = '';

            connections.forEach(conn => {
                if (conn.pid) {
                    // Template for user processes
                    tableContent += `
                        <tr class="border-b border-slate-800">
                            <td class="p-4 font-mono text-cyan-400">${conn.port}</td>
                            <td class="p-4">${conn.pid}</td>
                            <td class="p-4">
                                <div class="flex items-center">
                                    <span class="px-2 py-1 text-xs font-semibold bg-blue-500 text-white rounded-full">${conn.name}</span>
                                </div>
                            </td>
                            <td class="p-4 text-center">
                                <button id="kill-btn-${conn.pid}" onclick="killProcess(${conn.pid})" class="bg-red-600 hover:bg-red-700 text-white font-bold py-1 px-3 rounded text-xs">Kill</button>
                            </td>
                        </tr>
                    `;
                } else {
                    // Template for system/protected processes
                    tableContent += `
                        <tr class="border-b border-slate-800">
                            <td class="p-4 font-mono text-slate-500">${conn.port}</td>
                            <td class="p-4 text-slate-500">N/A</td>
                            <td class="p-4">
                                <div class="flex items-center">
                                    <span class="px-2 py-1 text-xs font-semibold bg-slate-700 text-slate-300 rounded-full">Protected</span>
                                </div>
                            </td>
                            <td class="p-4 text-center">
                                <span class="text-xs text-slate-500 italic">System Protected</span>
                            </td>
                        </tr>
                    `;
                }
            });
            tableBody.innerHTML = tableContent;
        };

        function killProcess(pid) {
            const killButton = document.getElementById(`kill-btn-${pid}`);
            if (killButton) {
                killButton.innerHTML = 'Killing...';
                killButton.disabled = true;
            }

            fetch(`/api/kill/${pid}`, {
                method: 'POST',
            })
            .then(response => response.json())
            .then(data => {
                console.log(data.message);
                // The WebSocket will update the table automatically, so no need to re-enable the button here.
            })
            .catch((error) => {
                console.error('Error:', error);
                if (killButton) {
                    // Restore button on error
                    killButton.innerHTML = 'Kill';
                    killButton.disabled = false;
                }
            });
        }
    </script>
</body>
</html>
