<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080c10;
      --surface:   #0e1419;
      --surface2:  #141b22;
      --border:    #1e2a35;
      --border2:   #253040;
      --text:      #d4dde6;
      --muted:     #4d6070;
      --accent:    #00d4ff;
      --accent2:   #0099bb;
      --green:     #00e676;
      --green-dim: #00c85310;
      --red:       #ff4d4d;
      --red-dim:   #ff4d4d12;
      --yellow:    #ffc400;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-ui:   'Inter', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      min-height: 100vh;
      padding: 0;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
    }

    .layout {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 40px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--border);
    }

    .logo-group { display: flex; flex-direction: column; gap: 6px; }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 28px; height: 28px;
      border: 1.5px solid var(--accent);
      border-radius: 6px;
      display: grid;
      place-items: center;
    }

    .logo-icon svg { width: 14px; height: 14px; }

    h1 {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
    }

    .tagline {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    .header-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      background: var(--green-dim);
      border: 1px solid #00e67620;
      border-radius: 20px;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--green);
      letter-spacing: 0.04em;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      position: relative;
    }

    .dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: var(--green);
      opacity: 0.3;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50%       { transform: scale(1.8); opacity: 0; }
    }

    .stats-row {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .stat {
      text-align: right;
    }

    .stat-value {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 600;
      color: #fff;
      line-height: 1;
    }

    .stat-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 3px;
    }

    .stat-divider {
      width: 1px;
      height: 28px;
      background: var(--border2);
    }

    /* ── Filter Bar ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .filter-btn {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border2);
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--font-ui);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover { border-color: var(--border2); color: var(--text); }

    .filter-btn.active {
      background: var(--surface2);
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-spacer { flex: 1; }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-wrap svg {
      position: absolute;
      left: 10px;
      color: var(--muted);
      width: 13px; height: 13px;
      pointer-events: none;
    }

    #search {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 6px 12px 6px 30px;
      width: 200px;
      outline: none;
      transition: border-color 0.15s;
    }

    #search:focus { border-color: var(--accent2); }
    #search::placeholder { color: var(--muted); }

    /* ── Grid ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    /* ── Service Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s, transform 0.2s;
      animation: cardIn 0.25s ease forwards;
      cursor: default;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card:hover {
      border-color: var(--border2);
      transform: translateY(-1px);
    }

    .card.dying {
      opacity: 0.4;
      filter: grayscale(1);
      pointer-events: none;
      transition: opacity 0.4s, filter 0.4s;
    }

    /* Card top row */
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .service-id {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .service-icon {
      width: 34px; height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 16px;
      flex-shrink: 0;
      border: 1px solid transparent;
    }

    .service-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      line-height: 1.2;
    }

    .service-proc {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* Status badge */
    .status-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-family: var(--font-mono);
      font-weight: 500;
    }

    .status-badge.up {
      background: var(--green-dim);
      border: 1px solid #00e67618;
      color: var(--green);
    }

    .status-badge.protected {
      background: #ffffff08;
      border: 1px solid var(--border2);
      color: var(--muted);
    }

    .status-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Card meta row */
    .card-meta {
      display: flex;
      gap: 20px;
    }

    .meta-item { display: flex; flex-direction: column; gap: 2px; }

    .meta-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .meta-value {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
    }

    .meta-value.muted { color: var(--muted); }

    /* Card bottom row */
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .open-link {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
      padding: 4px 0;
    }

    .open-link svg { width: 11px; height: 11px; }

    .open-link:hover { color: var(--accent); }

    .card-actions { display: flex; gap: 6px; }

    .btn-kill {
      padding: 5px 14px;
      border-radius: 7px;
      border: 1px solid #ff4d4d30;
      background: var(--red-dim);
      color: var(--red);
      font-size: 11px;
      font-family: var(--font-mono);
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-kill:hover:not(:disabled) {
      background: #ff4d4d22;
      border-color: #ff4d4d60;
    }

    .btn-kill:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Empty state */
    #empty {
      display: none;
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 0;
      color: var(--muted);
    }

    #empty svg { width: 40px; height: 40px; margin-bottom: 12px; opacity: 0.3; }
    #empty p { font-size: 13px; }

    /* Protected card style */
    .card.protected-card {
      border-style: dashed;
      opacity: 0.6;
    }

    .card.protected-card:hover { opacity: 0.7; transform: none; }

    /* Separator between user/system */
    .section-label {
      grid-column: 1 / -1;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 10px 18px;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 10px;
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text);
      z-index: 100;
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.2s;
      pointer-events: none;
    }
    
    .status-badge.unknown {
      background: #ffffff06;
      border: 1px solid var(--border2);
      color: var(--muted);
    }

    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.error { border-color: #ff4d4d50; color: var(--red); }
    #toast.success { border-color: #00e67640; color: var(--green); }
  </style>
</head>
<body>

<div class="layout">
  <header>
    <div class="logo-group">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="7" cy="7" r="2.5" stroke="#00d4ff" stroke-width="1.2"/>
            <path d="M7 1v2M7 11v2M1 7h2M11 7h2" stroke="#00d4ff" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1>portmap</h1>
      </div>
      <span class="tagline">Local service monitor · Real-time</span>
    </div>

    <div class="header-right">
      <div class="live-badge">
        <span class="dot"></span>
        LIVE
      </div>
      <div class="stats-row">
        <div class="stat">
          <div class="stat-value" id="count-active">—</div>
          <div class="stat-label">Active</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <div class="stat-value" id="count-protected">—</div>
          <div class="stat-label">Protected</div>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
          <div class="stat-value" id="count-total">—</div>
          <div class="stat-label">Total</div>
        </div>
      </div>
    </div>
  </header>

  <div class="filter-bar">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="user">User</button>
    <button class="filter-btn" data-filter="system">System</button>
    <div class="filter-spacer"></div>
    <div class="search-wrap">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="6.5" cy="6.5" r="4.5"/><path d="M11 11l3 3" stroke-linecap="round"/>
      </svg>
      <input id="search" type="text" placeholder="filter ports, names..." />
    </div>
  </div>

  <div id="grid">
    <div id="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round"/>
      </svg>
      <p>No services match your filter.</p>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  // ── Service metadata (icons + colors) ──
  const FRAMEWORK_META = {
    'Django':       { emoji: '🟢', bg: '#0c4b3310', border: '#0c4b3340', accent: '#44b78b' },
    'Python':       { emoji: '🐍', bg: '#3572a510', border: '#3572a530', accent: '#3572a5' },
    'FastAPI':      { emoji: '⚡', bg: '#00b09610', border: '#00b09630', accent: '#00b096' },
    'Node.js':      { emoji: '📦', bg: '#41692110', border: '#41692130', accent: '#8bc34a' },
    'Go':           { emoji: '🐹', bg: '#00add810', border: '#00add830', accent: '#00add8' },
    'Rust':         { emoji: '🦀', bg: '#de3a1710', border: '#de3a1730', accent: '#de3a17' },
    'Ruby':         { emoji: '💎', bg: '#cc342d10', border: '#cc342d30', accent: '#cc342d' },
    'Java':         { emoji: '☕', bg: '#b0721310', border: '#b0721330', accent: '#b07213' },
    'Redis':        { emoji: '🔴', bg: '#dc143c10', border: '#dc143c30', accent: '#dc143c' },
    'PostgreSQL':   { emoji: '🐘', bg: '#33669910', border: '#33669930', accent: '#336699' },
    'MySQL':        { emoji: '🐬', bg: '#0076a310', border: '#0076a330', accent: '#0076a3' },
    'MongoDB':      { emoji: '🍃', bg: '#00ed6410', border: '#00ed6430', accent: '#00ed64' },
    'Nginx':        { emoji: '🌐', bg: '#26962510', border: '#26962530', accent: '#269625' },
    'Docker':       { emoji: '🐳', bg: '#0db7ed10', border: '#0db7ed30', accent: '#0db7ed' },
    'PHP':          { emoji: '🐘', bg: '#77719910', border: '#77719930', accent: '#777199' },
  };

  const UNKNOWN_META = { emoji: '●', bg: '#ffffff06', border: '#ffffff12', accent: '#4d6070' };

  function getMeta(framework) {
    if (!framework) return UNKNOWN_META;
    return FRAMEWORK_META[framework] || UNKNOWN_META;
  }

  // ── State ──
  let allConnections = [];
  let activeFilter = 'all';
  let searchQuery = '';

  // ── WebSocket ──
  let ws;
  function connect() {
    ws = new WebSocket(`ws://${window.location.host}/ws/scan`);
    ws.onmessage = (e) => {
      allConnections = JSON.parse(e.data);
      render();
    };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  connect();

  // ── Filters ──
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      render();
    });
  });

  document.getElementById('search').addEventListener('input', (e) => {
    searchQuery = e.target.value.toLowerCase();
    render();
  });

  // ── Render ──
  // ── Render ──
  function render() {
    const grid = document.getElementById('grid');

    let filtered = allConnections.filter(conn => {
      if (activeFilter === 'user'   && conn.kind === 'system') return false;
      if (activeFilter === 'system' && conn.kind !== 'system') return false;
      if (searchQuery) {
        const q = searchQuery;
        return String(conn.port).includes(q) ||
               conn.name.toLowerCase().includes(q);
      }
      return true;
    });

    // Stats
    const projectCount  = allConnections.filter(c => c.kind === 'project' || c.kind === 'infrastructure').length;
    const sysCount      = allConnections.filter(c => c.kind === 'system').length;

    document.getElementById('count-active').textContent    = projectCount;
    document.getElementById('count-protected').textContent = sysCount;
    document.getElementById('count-total').textContent     = allConnections.length;

    // Empty state
    const empty = document.getElementById('empty');
    empty.style.display = filtered.length === 0 ? 'block' : 'none';

    // 2 Sections Layout: User Services (Projects + Unconfirmed) & System
    const userConns = filtered.filter(c => c.kind !== 'system');
    const sysConns  = filtered.filter(c => c.kind === 'system');

    let html = '';

    if (userConns.length > 0) {
      html += `<div class="section-label">User Services · ${userConns.length}</div>`;
      userConns.forEach(conn => { html += buildUserCard(conn); });
    }

    if (sysConns.length > 0) {
      html += `<div class="section-label">System · ${sysConns.length}</div>`;
      sysConns.forEach(conn => { html += buildSystemCard(conn); });
    }

    const cards = grid.querySelectorAll('.card, .section-label');
    cards.forEach(el => el.remove());
    grid.insertAdjacentHTML('beforeend', html);
  }

  function buildUserCard(conn) {
    const meta      = getMeta(conn.framework);
    const localUrl  = `http://localhost:${conn.port}`;
    const isProject = conn.kind === 'project';

    const displayName = conn.name || conn.framework;

    const subtitle = isProject
      ? (conn.framework || `pid ${conn.pid}`)
      : `pid ${conn.pid}`;

    const cardBorder = conn.framework
      ? `border-color: ${meta.border}`
      : 'border-color: var(--border)';

    return `
      <div class="card" id="card-${conn.pid}"
           data-pid="${conn.pid}"
           data-port="${conn.port}"
           style="${cardBorder}">

        <div class="card-top">
          <div class="service-id">
            <div class="service-icon"
                 style="background:${meta.bg}; border-color:${meta.border}; font-size:15px">
              ${meta.emoji}
            </div>
            <div>
              <div class="service-name">${displayName}</div>
              <div class="service-proc">${subtitle}</div>
            </div>
          </div>

          <div class="status-badge ${conn.framework ? 'up' : 'unknown'}">
            <span class="status-dot"></span>
            ${conn.framework ? conn.kind.toUpperCase() : 'UNCONFIRMED'}
          </div>
        </div>

        <div class="card-meta">
          <div class="meta-item">
            <span class="meta-label">Port</span>
            <span class="meta-value">:${conn.port}</span>
          </div>
          ${conn.cwd ? `
          <div class="meta-item">
            <span class="meta-label">Project</span>
            <span class="meta-value" style="color:var(--muted);font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                  title="${conn.cwd}">${conn.cwd}</span>
          </div>` : ''}
        </div>

        <div class="card-bottom">
          <a class="open-link" href="${localUrl}" target="_blank" rel="noopener">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor"
                 stroke-width="1.5" stroke-linecap="round">
              <path d="M2 10L10 2M5 2h5v5"/>
            </svg>
            localhost:${conn.port}
          </a>
          <div class="card-actions">
            <button class="btn-kill"
                    id="kill-${conn.pid}"
                    onclick="killProcess(${conn.pid}, ${conn.port})">
              Kill
            </button>
          </div>
        </div> 
      </div>`;
  }

  function buildSystemCard(conn) {
    return `
      <div class="card protected-card" id="card-sys-${conn.port}">
        <div class="card-top">
          <div class="service-id">
            <div class="service-icon" style="background:#ffffff06;border-color:#ffffff10">🔒</div>
            <div>
              <div class="service-name" style="color:#4d6070">System Process</div>
              <div class="service-proc">pid protected</div>
            </div>
          </div>
          <div class="status-badge protected">
            <span class="status-dot"></span>
            SYS
          </div>
        </div>
        <div class="card-meta">
          <div class="meta-item">
            <span class="meta-label">Port</span>
            <span class="meta-value muted">:${conn.port}</span>
          </div>
        </div>
        <div class="card-bottom">
          <span class="open-link" style="cursor:default">
            System protected
          </span>
        </div>
      </div>
    `;
  }

  // ── Kill ──
  async function killProcess(pid, port) {
    const btn  = document.getElementById(`kill-${pid}`);
    const card = document.getElementById(`card-${pid}`);

    if (btn)  { btn.textContent = 'Killing…'; btn.disabled = true; }
    if (card) { card.classList.add('dying'); }

    try {
      const res  = await fetch(`/api/kill/${pid}`, { method: 'POST' });
      const data = await res.json();
      if (res.ok) {
        showToast(`Port :${port} process terminated`, 'success');
      } else {
        showToast(data.detail || 'Kill failed', 'error');
        if (btn)  { btn.textContent = 'Kill'; btn.disabled = false; }
        if (card) { card.classList.remove('dying'); }
      }
    } catch {
      showToast('Network error', 'error');
      if (btn)  { btn.textContent = 'Kill'; btn.disabled = false; }
      if (card) { card.classList.remove('dying'); }
    }
  }

  // ── Toast ──
  let toastTimer;
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ''; }, 3000);
  }
</script>
